<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aim Training — treino de mira, tracking e reflexo grátis</title>
    <meta
      name="description"
      content="Treino de mira grátis no navegador: Gridshot, Flick, Headshot, Spidershot, Tracking, Counter-strafe e Reflexo. Importe a sensi do CS2 e do Valorant. Sem instalar."
    />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="canonical" href="https://treino-de-mira.vercel.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aim Training — treino de mira no navegador" />
    <meta property="og:description" content="7 treinos, sensi do CS2 e do Valorant, nota de F a S+. Grátis, sem instalar." />
    <meta property="og:url" content="https://treino-de-mira.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://treino-de-mira.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://treino-de-mira.vercel.app/og.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="screen home" id="home">
      <header class="topbar">
        <img class="topbar__logo" src="/logo.png" alt="Aim Training" width="150" height="100" />
        <div class="topbar__actions">
          <button class="icon-button" data-toggle-music aria-label="Música" aria-pressed="false"></button>
          <button class="icon-button" data-open-settings aria-label="Configurações"></button>
        </div>
      </header>
      <div class="hero">
        <h1 class="hero__title">Mira, controle e reflexo.<br /><span>Direto no navegador.</span></h1>
        <p class="hero__text">Sessões curtas, nota de F a S+ e recordes salvos neste dispositivo.</p>
        <div class="hero__controls">
          <div class="segmented" role="radiogroup" aria-label="Duração" data-durations></div>
          <button class="chip-button" data-sens-chip></button>
        </div>
      </div>
      <div class="modes" data-modes></div>
      <p class="notice" data-touch-notice hidden>
        Os treinos de mira precisam de mouse. No celular, só o Reflexo funciona bem.
      </p>
      <footer class="footer">
        Feito por
        <a href="https://joaopedrotech.netlify.app" target="_blank" rel="noopener">João Pedro Santana</a>
        ·
        <a href="https://github.com/jpsantana6699/Aim_Training" target="_blank" rel="noopener">código no GitHub</a>
      </footer>
    </section>

    <section class="screen play" id="play" hidden>
      <canvas class="play__canvas"></canvas>
      <div class="hud">
        <strong class="hud__score" data-hud="score"></strong>
        <strong class="hud__timer" data-hud="time"></strong>
        <span class="hud__detail" data-hud="detail"></span>
      </div>
      <div class="overlay" data-overlay hidden></div>
    </section>

    <section class="screen results" id="results" hidden></section>

    <dialog class="settings" id="settings"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
